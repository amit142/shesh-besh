<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הגדרת אליפות שש-בש 2025</title>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/firebase-config.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <div class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-lg bg-white dark:bg-gray-800 shadow-md rounded-lg p-8">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-white">הגדרת אליפות שש-בש 2025</h1>
                <p class="text-gray-600 dark:text-gray-400 mt-2">
                    לחץ על הכפתור כדי ליצור את המשתמשים, הטורניר והמשחקים עבור אליפות 2025.
                </p>
            </div>

            <div id="auth-container">
                <p class="text-center text-yellow-600 dark:text-yellow-400">ממתין לאימות משתמש...</p>
            </div>

            <div id="setup-container" class="hidden">
                <div class="text-center">
                    <button id="setup-championship-button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
                        התחל בהגדרת האליפות
                    </button>
                </div>
            </div>

            <div id="setup-status" class="mt-6"></div>
        </div>
    </div>

    <script type="module" src="js/championship-setup.js"></script>
</body>
</html>
