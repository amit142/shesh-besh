<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טורניר שש בש - זירת המשחק הדיגיטלית</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Landing Page Specific Styles */
        .hero-background {
            background: 
                radial-gradient(circle at 20% 80%, rgba(139, 69, 19, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(15, 81, 50, 0.3) 0%, transparent 50%),
                var(--bg-primary);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }
        
        .hero-background::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(220, 53, 69, 0.1) 0%, transparent 50%);
            animation: backgroundShift 20s ease-in-out infinite;
        }
        
        @keyframes backgroundShift {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }
        
        .floating-dice {
            position: absolute;
            animation: float 6s ease-in-out infinite;
        }
        
        .floating-dice:nth-child(1) { top: 10%; right: 10%; animation-delay: 0s; }
        .floating-dice:nth-child(2) { top: 20%; left: 15%; animation-delay: 2s; }
        .floating-dice:nth-child(3) { bottom: 20%; right: 20%; animation-delay: 4s; }
        .floating-dice:nth-child(4) { bottom: 30%; left: 10%; animation-delay: 1s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        
        .logo-container {
            position: relative;
            display: inline-block;
        }
        
        .logo-glow {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: glow 3s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        
        .auth-card {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 240, 0.95);
            border: 2px solid rgba(139, 69, 19, 0.2);
        }
        
        .dark .auth-card {
            background: rgba(26, 32, 44, 0.95);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .feature-icon {
            background: var(--felt-green);
            background-image: radial-gradient(circle at center, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
        }
    </style>
</head>
<body>
    <!-- Theme Toggle -->
    <button id="theme-toggle" class="theme-toggle">
        <svg class="w-6 h-6 text-white sun-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
        <svg class="w-6 h-6 text-white moon-icon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
    </button>

    <!-- Floating Dice Background -->
    <div class="hero-background">
        <div class="floating-dice dice" style="--i: 0;"></div>
        <div class="floating-dice dice" style="--i: 1;"></div>
        <div class="floating-dice dice" style="--i: 2;"></div>
        <div class="floating-dice dice" style="--i: 3;"></div>
        
        <!-- Main Content -->
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="max-w-md w-full fade-in">
                <!-- Logo/Title -->
                <div class="text-center mb-12">
                    <div class="logo-container mb-6">
                        <div class="logo-glow"></div>
                        <div class="w-24 h-24 mx-auto wood-texture rounded-2xl flex items-center justify-center relative">
                            <!-- Backgammon Board Icon -->
                            <svg class="w-12 h-12 text-gold" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M2 2h20v20H2V2zm2 2v16h16V4H4zm2 2h2v2H6V6zm4 0h2v2h-2V6zm4 0h2v2h-2V6zm4 0h2v2h-2V6zM6 10h2v2H6v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zM6 14h2v2H6v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zM6 18h2v2H6v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2z"/>
                            </svg>
                            <!-- Decorative Checkers -->
                            <div class="checker red absolute -top-2 -right-2" style="width: 20px; height: 20px;"></div>
                            <div class="checker black absolute -bottom-2 -left-2" style="width: 20px; height: 20px;"></div>
                        </div>
                    </div>
                    <h1 class="text-5xl font-bold text-white mb-4 drop-shadow-lg">טורניר שש בש</h1>
                    <p class="text-xl text-white/90 drop-shadow-md">זירת המשחק הדיגיטלית</p>
                    <p class="text-lg text-white/80 mt-2">ארגן ונהל טורנירים עם עמיתיך לעבודה</p>
                </div>

                <!-- Sign In Card -->
                <div id="signin-card" class="auth-card game-card p-8 mb-6 slide-in-right">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-bold text-wood-dark mb-2">ברוכים השבים לזירה</h2>
                        <p class="text-text-secondary">התחברו כדי להצטרף למשחק</p>
                    </div>

                    <!-- Google Sign In Button -->
                    <button id="google-signin" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-wood-light rounded-xl px-6 py-4 text-wood-dark font-semibold hover:bg-gray-50 transition-all duration-300 shadow-lg hover:shadow-xl mb-6 group">
                        <svg class="w-6 h-6 group-hover:scale-110 transition-transform" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        המשך עם Google
                    </button>

                    <!-- Divider -->
                    <div class="relative my-6">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t-2 border-wood-light"></div>
                        </div>
                        <div class="relative flex justify-center">
                            <span class="px-4 bg-ivory text-wood-medium font-semibold">או</span>
                        </div>
                    </div>

                    <!-- Email Sign In Form -->
                    <form id="signin-form" class="space-y-4">
                        <div class="form-group">
                            <label class="form-label">כתובת אימייל</label>
                            <input type="email" name="email" class="form-input" placeholder="הכנס את האימייל שלך" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">סיסמה</label>
                            <input type="password" name="password" class="form-input" placeholder="הכנס את הסיסמה שלך" required>
                        </div>
                        <button type="submit" class="w-full btn-primary">כניסה לזירה</button>
                    </form>

                    <!-- Sign Up Link -->
                    <div class="text-center mt-6">
                        <p class="text-text-secondary">
                            חדש בזירה? 
                            <button id="show-signup" class="text-checker-red hover:text-red-700 font-semibold underline">הירשם עכשיו</button>
                        </p>
                    </div>

                    <!-- Loading State -->
                    <div id="loading" class="hidden text-center mt-6">
                        <div class="loading-dice">
                            <div class="dice" style="--i: 0;"></div>
                            <div class="dice" style="--i: 1;"></div>
                        </div>
                        <p class="text-wood-medium mt-2">נכנס לזירה...</p>
                    </div>
                </div>

                <!-- Sign Up Card -->
                <div id="signup-card" class="hidden auth-card game-card p-8 mb-6 slide-in-left">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-bold text-wood-dark mb-2">הצטרף לזירה</h2>
                        <p class="text-text-secondary">צור חשבון חדש והתחל לשחק</p>
                    </div>

                    <!-- Google Sign Up Button -->
                    <button id="google-signup" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-wood-light rounded-xl px-6 py-4 text-wood-dark font-semibold hover:bg-gray-50 transition-all duration-300 shadow-lg hover:shadow-xl mb-6 group">
                        <svg class="w-6 h-6 group-hover:scale-110 transition-transform" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        המשך עם Google
                    </button>

                    <!-- Divider -->
                    <div class="relative my-6">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t-2 border-wood-light"></div>
                        </div>
                        <div class="relative flex justify-center">
                            <span class="px-4 bg-ivory text-wood-medium font-semibold">או</span>
                        </div>
                    </div>

                    <!-- Email Sign Up Form -->
                    <form id="signup-form" class="space-y-4">
                        <div class="form-group">
                            <label class="form-label">שם מלא</label>
                            <input type="text" name="displayName" class="form-input" placeholder="הכנס את השם שלך" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">כתובת אימייל</label>
                            <input type="email" name="email" class="form-input" placeholder="הכנס את האימייל שלך" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">סיסמה</label>
                            <input type="password" name="password" class="form-input" placeholder="צור סיסמה חזקה" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label class="form-label">אישור סיסמה</label>
                            <input type="password" name="confirmPassword" class="form-input" placeholder="אשר את הסיסמה" required minlength="6">
                        </div>
                        <button type="submit" class="w-full btn-primary">הצטרף לזירה</button>
                    </form>

                    <!-- Sign In Link -->
                    <div class="text-center mt-6">
                        <p class="text-text-secondary">
                            כבר יש לך חשבון? 
                            <button id="show-signin" class="text-checker-red hover:text-red-700 font-semibold underline">התחבר</button>
                        </p>
                    </div>
                </div>

                <!-- Features Preview -->
                <div class="grid grid-cols-2 gap-4 fade-in" style="animation-delay: 0.5s;">
                    <div class="game-card p-4 text-center hover:scale-105 transition-transform">
                        <div class="feature-icon w-12 h-12 rounded-xl mx-auto mb-3 flex items-center justify-center">
                            <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3z"/>
                            </svg>
                        </div>
                        <h3 class="font-bold text-wood-dark text-sm">יצירת טורנירים</h3>
                        <p class="text-xs text-text-secondary mt-1">ארגן תחרויות מקצועיות</p>
                    </div>
                    <div class="game-card p-4 text-center hover:scale-105 transition-transform">
                        <div class="feature-icon w-12 h-12 rounded-xl mx-auto mb-3 flex items-center justify-center">
                            <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                            </svg>
                        </div>
                        <h3 class="font-bold text-wood-dark text-sm">לוח תוצאות חי</h3>
                        <p class="text-xs text-text-secondary mt-1">מעקב בזמן אמת</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
