<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>זירת שש בש - טורניר</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Tournament Page Specific Styles */
        .tournament-bg {
            background: var(--bg-primary);
            min-height: 100vh;
            position: relative;
        }
        
        .tournament-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 15% 25%, rgba(139, 69, 19, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 75%, rgba(15, 81, 50, 0.15) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .tournament-header {
            background: var(--wood-dark);
            background-image: 
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 2px,
                    rgba(0,0,0,0.1) 2px,
                    rgba(0,0,0,0.1) 4px
                );
            border-bottom: 4px solid var(--gold);
            box-shadow: 0 4px 20px var(--shadow-heavy);
        }
        
        .tournament-info-card {
            background: var(--felt-green);
            background-image: 
                radial-gradient(circle at 1px 1px, rgba(255,255,255,0.1) 1px, transparent 0);
            background-size: 20px 20px;
            border: 3px solid var(--gold);
            position: relative;
            overflow: hidden;
        }
        
        .tournament-info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--gold), var(--checker-red), var(--gold));
        }
        
        .participant-avatar {
            border: 3px solid var(--gold);
            box-shadow: 0 4px 12px var(--shadow-medium);
            position: relative;
        }
        
        .participant-avatar::after {
            content: '';
            position: absolute;
            top: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            background: var(--felt-green);
            border: 2px solid white;
            border-radius: 50%;
        }
        
        .group-tab {
            background: var(--wood-medium);
            color: var(--text-light);
            border: 2px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }
        
        .group-tab.active {
            background: var(--felt-green);
            border-color: var(--gold);
            box-shadow: 0 4px 16px var(--shadow-medium);
        }
        
        .group-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .group-tab:hover::before {
            left: 100%;
        }
        
        .leaderboard-card {
            background: var(--ivory);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px var(--shadow-medium);
        }
        
        .leaderboard-header {
            background: var(--wood-dark);
            background-image: 
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 10px,
                    rgba(0,0,0,0.1) 10px,
                    rgba(0,0,0,0.1) 20px
                );
            color: var(--text-light);
            padding: 20px;
            text-align: center;
            position: relative;
        }
        
        .leaderboard-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--checker-red), var(--gold));
        }
        
        .setup-phase {
            background: var(--felt-green);
            background-image: 
                radial-gradient(circle at 1px 1px, rgba(255,255,255,0.1) 1px, transparent 0);
            background-size: 20px 20px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .setup-phase::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 30% 30%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(220, 53, 69, 0.1) 0%, transparent 50%);
        }
        
        .tournament-code-display {
            background: var(--wood-dark);
            color: var(--gold);
            padding: 12px 24px;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            border: 2px solid var(--gold);
            box-shadow: 
                0 4px 16px var(--shadow-medium),
                inset 0 2px 4px rgba(255, 215, 0, 0.2);
        }
        
        .match-card-enhanced {
            background: var(--ivory);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin: 12px 0;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .match-card-enhanced::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: var(--felt-green);
        }
        
        .match-card-enhanced.pending::before {
            background: linear-gradient(180deg, #F59E0B, #D97706);
        }
        
        .match-card-enhanced.completed::before {
            background: linear-gradient(180deg, #10B981, #059669);
        }
        
        .match-card-enhanced:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px var(--shadow-heavy);
        }
        
        .player-vs-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        
        .player-section {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        
        .vs-divider {
            background: var(--felt-green);
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            position: relative;
            margin: 0 16px;
        }
        
        .vs-divider::before,
        .vs-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
        }
        
        .vs-divider::before {
            right: 100%;
            border-right: 12px solid var(--felt-green);
        }
        
        .vs-divider::after {
            left: 100%;
            border-left: 12px solid var(--felt-green);
        }
        
        .score-section {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 28px;
            font-weight: bold;
        }
        
        .score-box {
            background: var(--wood-dark);
            color: var(--text-light);
            padding: 12px 20px;
            border-radius: 12px;
            min-width: 80px;
            text-align: center;
            box-shadow: 
                0 4px 12px var(--shadow-medium),
                inset 0 2px 4px rgba(255, 255, 255, 0.1);
        }
        
        .winner-indicator {
            background: var(--gold);
            color: var(--wood-dark);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        @media (max-width: 768px) {
            .player-vs-section {
                flex-direction: column;
                gap: 16px;
            }
            
            .vs-divider {
                margin: 0;
            }
            
            .vs-divider::before,
            .vs-divider::after {
                display: none;
            }
            
            .score-section {
                font-size: 24px;
                gap: 16px;
            }
        }
    </style>
</head>
<body class="tournament-bg">
    <!-- Theme Toggle -->
    <button id="theme-toggle" class="theme-toggle">
        <svg class="w-6 h-6 text-white sun-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
        <svg class="w-6 h-6 text-white moon-icon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
    </button>

    <!-- Navigation Header -->
    <nav class="tournament-header">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Back Button and Title -->
                <div class="flex items-center gap-4">
                    <button id="back-button" class="p-3 rounded-xl hover:bg-white/10 transition-colors backdrop-blur-sm">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                    </button>
                    <div>
                        <h1 id="tournament-name" class="text-2xl font-bold text-white">טוען...</h1>
                        <div class="flex items-center gap-3 text-sm">
                            <span id="tournament-status" class="status-badge status-setup">הגדרה</span>
                            <span id="tournament-code" class="text-gold font-mono font-semibold">קוד: ...</span>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex items-center gap-4">
                    <!-- Share Button -->
                    <button id="share-tournament" class="p-3 rounded-xl hover:bg-white/10 transition-colors backdrop-blur-sm">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.367 2.684 3 3 0 00-5.367-2.684z"></path>
                        </svg>
                    </button>

                    <!-- Admin Menu (only for tournament creator) -->
                    <div id="admin-menu" class="hidden relative">
                        <button id="admin-menu-button" class="p-3 rounded-xl hover:bg-white/10 transition-colors backdrop-blur-sm">
                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path>
                            </svg>
                        </button>
                        <div id="admin-dropdown" class="hidden absolute left-0 mt-2 w-56 bg-white dark:bg-gray-800 rounded-xl shadow-2xl border border-gray-200 dark:border-gray-700 z-50 overflow-hidden">
                            <div class="p-4 bg-felt-green text-white">
                                <div class="font-semibold">תפריט מנהל</div>
                                <div class="text-sm opacity-90">נהל את הטורניר</div>
                            </div>
                            <div class="py-2">
                                <button id="start-tournament" class="w-full text-right px-4 py-3 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-3">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h1.586a1 1 0 01.707.293l2.414 2.414a1 1 0 00.707.293H15M9 10V9a2 2 0 012-2h2a2 2 0 012 2v1M9 10v5a2 2 0 002 2h2a2 2 0 002-2v-5"></path>
                                    </svg>
                                    התחל טורניר
                                </button>
                                <button id="edit-tournament" class="w-full text-right px-4 py-3 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-3">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                    </svg>
                                    ערוך הגדרות
                                </button>
                                <button id="delete-tournament" class="w-full text-right px-4 py-3 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 flex items-center gap-3">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                    </svg>
                                    מחק טורניר
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative z-10">
        <!-- Tournament Info -->
        <div id="tournament-info" class="tournament-info-card game-card p-8 mb-8 fade-in">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-white mb-2">סקירת הטורניר</h2>
                    <p class="text-white/80">מידע כללי על המשתתפים והמצב</p>
                </div>
                <div class="text-left">
                    <div id="participants-count" class="text-3xl font-bold text-gold">0/0</div>
                    <div class="text-white/70 text-sm">שחקנים</div>
                </div>
            </div>
            
            <!-- Participants List -->
            <div id="participants-list" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
                <!-- Loading state -->
                <div id="participants-loading" class="col-span-full">
                    <div class="flex items-center gap-6 justify-center">
                        <div class="loading-dice">
                            <div class="dice" style="--i: 0;"></div>
                            <div class="dice" style="--i: 1;"></div>
                        </div>
                        <span class="text-white">טוען משתתפים...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Groups Navigation -->
        <div id="groups-navigation" class="mb-8">
            <div class="groups-navigation">
                <!-- Group tabs will be generated here -->
            </div>
        </div>

        <!-- Group Content -->
        <div id="group-content">
            <!-- Setup Phase -->
            <div id="setup-phase" class="setup-phase p-12 text-center bounce-in">
                <div class="relative z-10">
                    <div class="w-24 h-24 mx-auto mb-6 wood-texture rounded-2xl flex items-center justify-center">
                        <svg class="w-12 h-12 text-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <h3 class="text-3xl font-bold text-white mb-4">הגדרת הטורניר</h3>
                    <p class="text-xl text-white/90 mb-8">ממתין לשחקנים נוספים או למנהל להתחיל את הטורניר</p>
                    <div class="flex items-center justify-center gap-6 mb-8">
                        <span class="text-lg text-white/80">קוד הטורניר:</span>
                        <div class="tournament-code-display" id="setup-code">LOADING</div>
                        <button id="copy-code" class="p-3 rounded-xl bg-white/10 hover:bg-white/20 transition-colors backdrop-blur-sm">
                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="flex justify-center gap-4">
                        <div class="dice rolling" style="--i: 0;"></div>
                        <div class="dice rolling" style="--i: 1;"></div>
                    </div>
                </div>
            </div>

            <!-- Active Tournament Content -->
            <div id="active-content" class="hidden">
                <!-- Group View -->
                <div id="group-view" class="space-y-8">
                    <!-- Leaderboard -->
                    <div class="leaderboard-card slide-in-right">
                        <div class="leaderboard-header">
                            <div class="flex items-center justify-between">
                                <h3 class="text-2xl font-bold">דירוג הקבוצה</h3>
                                <button id="refresh-standings" class="p-2 rounded-lg hover:bg-white/10 transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div id="leaderboard" class="p-6">
                            <!-- Leaderboard entries will be generated here -->
                        </div>
                    </div>

                    <!-- Matches -->
                    <div class="game-card p-6 slide-in-left">
                        <div class="flex items-center justify-between mb-6">
                            <div>
                                <h3 class="text-2xl font-bold text-wood-dark mb-2">משחקים</h3>
                                <p class="text-text-secondary">כל המשחקים בקבוצה הנוכחית</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <select id="match-filter" class="form-input py-2 px-3 text-sm">
                                    <option value="all">כל המשחקים</option>
                                    <option value="pending">ממתינים</option>
                                    <option value="completed">הושלמו</option>
                                    <option value="my-matches">המשחקים שלי</option>
                                </select>
                            </div>
                        </div>
                        <div id="matches-list" class="space-y-4">
                            <!-- Matches will be generated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modals Container -->
    <div id="modals-container"></div>

    <!-- Scripts -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/tournament.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
